<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#F5F2E9" rx="12"/>
  <g transform="translate(15, 10) scale(0.83)">
    
